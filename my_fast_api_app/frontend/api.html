<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI + Frontend</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f4; }
        .data-container { margin-top: 30px; padding: 20px; border: 2px solid #28a745; background-color: white; display: inline-block; border-radius: 8px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Cliente Sencillo (Frontend)</h1>
    <p>Haz clic en el botón para llamar al *endpoint* del Backend de FastAPI:</p>
    
    <button onclick="llamarApi()">Llamar a la API</button>
    
    <div class="data-container">
        <p><strong>Respuesta de la API:</strong></p>
        <div id="respuesta">...</div>
    </div>

    <script>
        async function llamarApi() {
            const url = '/api/saludo'; // Esta es la ruta del endpoint en main.py
            const respuestaDiv = document.getElementById('respuesta');
            respuestaDiv.textContent = 'Cargando...';

            try {
                // Petición asíncrona al backend
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Error en la red: ${response.status}`);
                }

                // Parsear la respuesta JSON
                const data = await response.json();
                
                // Mostrar el mensaje recibido del backend
                respuestaDiv.textContent = data.mensaje;
                respuestaDiv.style.color = '#28a745'; // Color verde para éxito

            } catch (error) {
                // Manejo de errores
                respuestaDiv.textContent = `Fallo al llamar a la API: ${error.message}`;
                respuestaDiv.style.color = 'red';
                console.error("Error:", error);
            }
        }
    </script>
</body>
</html>
